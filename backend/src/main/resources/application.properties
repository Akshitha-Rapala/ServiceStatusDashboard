spring.application.name=service-status-dashboard
server.port=8080
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
management.info.env.enabled=true
info.app.name=Service Status Dashboard
info.app.description=Time-boxed in-memory platform status demonstration
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] requestId=%X{requestId:-none} %logger{36} - %msg%n
